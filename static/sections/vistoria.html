<div
  class="max-w-2xl mx-auto space-y-8 pb-24 animate-fade-in"
  x-data="vistoriaModule"
>
  <div class="flex items-center justify-between border-b border-[#E2E8F0] pb-6">
    <div>
      <h2 class="text-2xl font-black uppercase tracking-tighter text-[#2D3436]">
        Vistoria Operacional
      </h2>
      <div class="flex items-center gap-2 mt-1">
        <span class="relative flex h-2 w-2">
          <span
            class="animate-ping absolute inline-flex h-full w-full rounded-full bg-[#00B894] opacity-75"
          ></span>
          <span
            class="relative inline-flex rounded-full h-2 w-2 bg-[#00B894]"
          ></span>
        </span>
        <p
          class="text-[10px] text-[#64748B] font-mono uppercase tracking-widest font-bold"
          x-text="pgrsData.setor || 'AGUARDANDO LOCALIZAÇÃO...'"
        ></p>
      </div>
    </div>
    <div
      class="bg-white border border-slate-200 shadow-sm px-4 py-2 rounded-xl text-right"
    >
      <span
        class="text-[8px] font-bold text-[#64748B] block uppercase tracking-tighter"
        >Sincronia IA</span
      >
      <span class="text-[10px] font-black text-[#00B894]">ATIVO // v1.4</span>
    </div>
  </div>

  <div class="grid grid-cols-1 gap-6">
    <div
      class="bg-white p-6 rounded-2xl border border-slate-200 shadow-sm border-t-4 border-[#00B894]"
    >
      <label
        class="text-[10px] uppercase font-black text-slate-400 tracking-widest mb-4 block italic"
        >Agente de Captura Multimodal</label
      >

      <div class="grid grid-cols-3 gap-4">
        <button
          @click="handleMediaDispatch('image/*')"
          class="flex flex-col items-center justify-center p-6 bg-[#F4F7F6] border border-[#E2E8F0] rounded-2xl active:scale-95 transition-all hover:border-[#00B894] hover:bg-white group"
        >
          <span class="text-3xl mb-2">📸</span>
          <span
            class="text-[9px] font-black uppercase text-[#64748B] group-hover:text-[#00B894]"
            >Foto</span
          >
        </button>

        <button
          @click="handleMediaDispatch('video/*')"
          class="flex flex-col items-center justify-center p-6 bg-[#F4F7F6] border border-[#E2E8F0] rounded-2xl active:scale-95 transition-all hover:border-red-400 hover:bg-white group"
        >
          <span class="text-3xl mb-2">🎥</span>
          <span
            class="text-[9px] font-black uppercase text-[#64748B] group-hover:text-red-500"
            >Vídeo</span
          >
        </button>

        <button
          @click="handleMediaDispatch('audio/*')"
          class="flex flex-col items-center justify-center p-6 bg-[#F4F7F6] border border-[#E2E8F0] rounded-2xl active:scale-95 transition-all hover:border-blue-400 hover:bg-white group"
        >
          <span class="text-3xl mb-2">🎙️</span>
          <span
            class="text-[9px] font-black uppercase text-[#64748B] group-hover:text-blue-500"
            >Voz IA</span
          >
        </button>
      </div>

      <div
        x-show="generating || progress > 0"
        x-transition
        class="mt-6 p-4 bg-[#2D3436] rounded-xl flex items-center gap-4 shadow-inner"
      >
        <div
          class="w-5 h-5 border-2 border-[#00B894] border-t-transparent rounded-full animate-spin"
          x-show="generating"
        ></div>
        <div class="flex-1">
          <div class="flex justify-between items-center mb-1">
            <p
              class="text-[10px] text-[#00B894] font-mono font-bold uppercase tracking-widest"
              x-text="statusMessage"
            ></p>
            <p
              class="text-[10px] text-white font-mono"
              x-text="progress + '%'"
            ></p>
          </div>
          <div class="w-full bg-white/10 h-1.5 rounded-full overflow-hidden">
            <div
              class="bg-[#00B894] h-full transition-all duration-500 shadow-[0_0_8px_#00B894]"
              :style="`width: ${progress}%` text-white"
            ></div>
          </div>
        </div>
      </div>
    </div>

    <div class="bg-white p-6 rounded-2xl border border-slate-200 shadow-sm">
      <label
        class="text-[10px] uppercase font-black text-slate-400 tracking-widest mb-2 block"
        >Ponto de Geração / Setor</label
      >
      <input
        type="text"
        x-model="pgrsData.setor"
        class="w-full bg-[#F4F7F6] border border-[#E2E8F0] rounded-xl px-4 py-4 text-sm font-bold focus:border-[#00B894] focus:bg-white outline-none transition-all placeholder:font-normal"
        placeholder="Ex: Central de Resíduos Classe I"
      />
    </div>

    <div
      class="bg-white p-6 rounded-2xl border border-slate-200 shadow-sm space-y-4"
    >
      <h4
        class="text-[10px] uppercase font-black text-slate-400 tracking-widest border-b border-slate-50 pb-3 flex justify-between items-center"
      >
        Conformidade PNRS & NBR
        <span class="bg-slate-100 text-slate-500 px-2 py-0.5 rounded text-[8px]"
          >Mandatório</span
        >
      </h4>
      <div class="grid grid-cols-1 gap-3">
        <template x-for="(label, key) in checklistItems" :key="key">
          <div
            @click="checklist[key] = !checklist[key]"
            :class="checklist[key] ? 'border-[#00B894] bg-emerald-50/30' : 'border-slate-100 bg-[#F4F7F6]/50'"
            class="flex items-center justify-between p-4 rounded-xl border transition-all cursor-pointer group"
          >
            <span
              class="text-xs font-bold text-[#2D3436]"
              :class="checklist[key] ? 'text-emerald-700' : ''"
              x-text="label"
            ></span>
            <div
              :class="checklist[key] ? 'bg-[#00B894]' : 'bg-slate-300'"
              class="w-10 h-5 rounded-full relative transition-colors"
            >
              <div
                :class="checklist[key] ? 'translate-x-5' : 'translate-x-1'"
                class="absolute top-1 w-3 h-3 bg-white rounded-full transition-transform shadow-sm"
              ></div>
            </div>
          </div>
        </template>
      </div>
    </div>

    <div class="bg-[#2D3436] p-6 rounded-2xl shadow-xl text-white">
      <div class="flex justify-between items-center mb-4">
        <div class="flex items-center gap-2">
          <div class="w-2 h-2 bg-[#00B894] rounded-full animate-pulse"></div>
          <span
            class="text-[10px] uppercase font-black text-[#00B894] tracking-widest"
            >Especialista PNRS IA</span
          >
        </div>
        <svg
          class="w-4 h-4 text-[#00B894]"
          fill="none"
          stroke="currentColor"
          viewBox="0 0 24 24"
        >
          <path
            d="M13 10V3L4 14h7v7l9-11h-7z"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          />
        </svg>
      </div>
      <textarea
        x-model="pgrsData.observacoes"
        class="w-full bg-white/5 border border-white/10 rounded-xl p-4 h-40 text-xs font-mono leading-relaxed text-slate-200 focus:border-[#00B894] outline-none transition-all resize-none"
        placeholder="Aguardando dados para transcrição ou relato técnico..."
      ></textarea>
      <p
        class="text-[9px] text-slate-500 mt-2 italic font-mono uppercase text-right"
      >
        Transcrição em Tempo Real habilitada
      </p>
    </div>

    <button
      @click="consolidateAnalysis()"
      :disabled="generating"
      class="w-full bg-[#00B894] hover:bg-[#00a383] text-white py-6 rounded-2xl font-black uppercase text-xs tracking-[0.3em] shadow-2xl shadow-[#00B894]/30 active:scale-[0.98] transition-all flex items-center justify-center gap-4 disabled:opacity-50 disabled:cursor-not-allowed"
    >
      <span x-show="!generating">Finalizar e Auditar</span>
      <div x-show="generating" class="flex items-center gap-3">
        <div
          class="w-4 h-4 border-2 border-white border-t-transparent rounded-full animate-spin"
        ></div>
        <span>Processando Laudo...</span>
      </div>
    </button>
  </div>
</div>
