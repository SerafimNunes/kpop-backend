<div class="max-w-md mx-auto space-y-8 pb-20">
  <div class="flex items-center justify-between border-b border-[#30363d] pb-6">
    <div>
      <h2
        class="text-xl font-black uppercase tracking-tighter text-emerald-500"
      >
        Vistoria de Campo
      </h2>
      <p
        class="text-[10px] text-zinc-500 font-mono"
        x-text="'REF: ' + (pgrsData.razao || 'GERADOR_NÃO_IDENTIFICADO')"
      ></p>
    </div>
    <div class="text-right">
      <span class="text-[9px] font-bold text-zinc-500 block uppercase"
        >GPS Ativo</span
      >
      <span
        class="inline-block w-2 h-2 bg-emerald-500 rounded-full animate-pulse"
      ></span>
    </div>
  </div>

  <div class="space-y-6">
    <div
      class="glass-panel p-6 rounded-[2rem] border-t-4 border-blue-500 shadow-xl"
    >
      <label class="text-[10px] font-black text-zinc-500 uppercase block mb-3">
        Setor ou Área Visitada (Ponto de Geração)
      </label>
      <input
        type="text"
        class="input-field mb-4"
        placeholder="Ex: Almoxarifado Central / Pátio de Sucata"
        x-model="pgrsData.setor"
      />

      <div class="grid grid-cols-3 gap-2">
        <button
          @click="$dispatch('capture-photo')"
          class="flex flex-col items-center justify-center p-4 bg-[#0d1117] border border-[#30363d] rounded-2xl active:scale-95 transition-transform hover:border-blue-500/50"
        >
          <span class="text-lg">📷</span>
          <span class="text-[8px] font-bold uppercase mt-2 text-zinc-400"
            >Foto</span
          >
        </button>

        <button
          @click="$dispatch('record-video')"
          class="flex flex-col items-center justify-center p-4 bg-[#0d1117] border border-[#30363d] rounded-2xl active:scale-95 transition-transform hover:border-red-500/50"
        >
          <span class="text-lg">🎥</span>
          <span class="text-[8px] font-bold uppercase mt-2 text-zinc-400"
            >Vídeo</span
          >
        </button>

        <button
          @click="$dispatch('start-audio')"
          class="flex flex-col items-center justify-center p-4 bg-[#0d1117] border border-[#30363d] rounded-2xl active:scale-95 transition-transform hover:border-emerald-500/50"
        >
          <span class="text-lg">🎤</span>
          <span class="text-[8px] font-bold uppercase mt-2 text-zinc-400"
            >Voz IA</span
          >
        </button>
      </div>
    </div>

    <div class="glass-panel p-6 rounded-[2rem] space-y-4">
      <h4
        class="text-[10px] font-black text-white uppercase tracking-widest border-b border-white/5 pb-2"
      >
        Checklist de Conformidade Ambiental
      </h4>

      <template
        x-for="(check, index) in [
          {id: 'segregacao', label: 'Segregação na Fonte (NBR 10004)'},
          {id: 'armazenamento', label: 'Armazenamento Coberto/Impermeável'},
          {id: 'identificacao', label: 'Rotulagem de Resíduos (GHS/NBR 7500)'},
          {id: 'vazamento', label: 'Dispositivos de Contenção/Kits Mitigação'}
        ]"
        :key="index"
      >
        <div
          class="flex items-center justify-between p-3 bg-black/20 rounded-xl border border-white/5"
        >
          <span
            class="text-[11px] text-zinc-300 font-medium"
            x-text="check.label"
          ></span>
          <label class="relative inline-flex items-center cursor-pointer">
            <input type="checkbox" class="sr-only peer" />
            <div
              class="w-9 h-5 bg-zinc-800 rounded-full peer peer-checked:after:translate-x-full after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-zinc-400 after:rounded-full after:h-4 after:w-4 after:transition-all peer-checked:bg-emerald-600"
            ></div>
          </label>
        </div>
      </template>
    </div>

    <div
      class="glass-panel p-6 rounded-[2rem] border-t-4 border-amber-500 shadow-xl"
    >
      <div class="flex justify-between items-center mb-3">
        <label class="text-[10px] font-black text-zinc-500 uppercase block">
          Relato Técnico da Engenheira
        </label>
        <span
          class="text-[9px] bg-amber-500/10 text-amber-500 px-2 py-0.5 rounded font-bold"
          >CORE INPUT</span
        >
      </div>

      <textarea
        x-model="pgrsData.observacoes"
        class="input-field h-40 resize-none text-xs leading-relaxed"
        placeholder="A IA analisará este texto em conjunto com as fotos/vídeos para sugerir inconformidades no laudo final..."
      ></textarea>

      <div
        x-show="generating"
        class="mt-4 p-3 bg-blue-500/10 border border-blue-500/20 rounded-lg flex items-center gap-3"
      >
        <div
          class="w-4 h-4 border-2 border-blue-500 border-t-transparent rounded-full animate-spin"
        ></div>
        <p
          class="text-[10px] text-blue-400 font-bold"
          x-text="statusMessage"
        ></p>
      </div>
    </div>

    <button
      @click="consolidateAnalysis()"
      :disabled="generating"
      class="w-full py-5 bg-emerald-600 hover:bg-emerald-500 disabled:bg-zinc-800 text-white rounded-2xl font-black uppercase text-xs tracking-[0.2em] shadow-lg shadow-emerald-900/40 transition-all flex items-center justify-center gap-3"
    >
      <span x-show="!generating" class="flex items-center gap-3">
        <svg
          class="w-4 h-4"
          fill="none"
          stroke="currentColor"
          viewBox="0 0 24 24"
        >
          <path
            d="M5 13l4 4L19 7"
            stroke-width="3"
            stroke-linecap="round"
            stroke-linejoin="round"
          />
        </svg>
        Sincronizar e Auditar com IA
      </span>
      <span x-show="generating">Processando Dados Multimodais...</span>
    </button>
  </div>
</div>
