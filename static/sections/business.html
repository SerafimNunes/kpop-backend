<div x-data="businessModule" class="space-y-8 animate-fade-in">
  <div class="flex flex-col md:flex-row justify-between items-start md:items-end gap-6 bg-white p-8 rounded-[2rem] border border-slate-100 shadow-sm">
    <div>
      <h2 class="text-3xl font-black text-slate-900 tracking-tighter uppercase italic">
        Business & Contracts
      </h2>
      <p
        class="text-slate-400 font-mono text-[10px] uppercase tracking-[0.3em] mt-2 flex items-center gap-2"
      >
        <span class="w-2 h-2 bg-blue-500 rounded-full animate-pulse"></span>
        <span x-text="statusMessage"></span>
      </p>
    </div>
    <div class="text-left md:text-right border-l md:border-l-2 border-slate-100 pl-6">
      <span
        class="text-[10px] font-black text-amber-600 block uppercase tracking-widest mb-1"
        >Faturamento Consolidado (Jan/2026)</span
      >
      <span class="text-3xl font-black text-slate-900 tracking-tighter"
        >R$ 155.000,00 <span class="text-emerald-500 text-sm ml-2 font-mono italic">↑ 12%</span></span
      >
    </div>
  </div>

  <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
    <div class="lg:col-span-1 space-y-6">
      <div
        class="bg-white border border-slate-200 rounded-[2rem] p-8 shadow-sm"
      >
        <h3
          class="text-slate-900 font-black mb-8 flex items-center gap-3 text-xs border-b border-slate-50 pb-6 uppercase tracking-widest"
        >
          <div class="p-2 bg-amber-50 rounded-lg">
            <svg
              class="w-5 h-5 text-amber-600"
              fill="none"
              stroke="currentColor"
              viewBox="0 0 24 24"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="2.5"
                d="M12 8c-1.657 0-3 .895-3 2s1.343 2 3 2 3 .895 3 2-1.343 2-3 2m0-8c1.11 0 2.08.402 2.599 1M12 8V7m0 1v8m0 0v1m0-1c-1.11 0-2.08-.402-2.599-1M21 12a9 9 0 11-18 0 9 9 0 0118 0z"
              />
            </svg>
          </div>
          Parâmetros da IA Comercial
        </h3>

        <div class="space-y-6">
          <div>
            <label class="label-tech text-slate-400">Entidade / Cliente</label>
            <input
              type="text"
              x-model="businessData.cliente"
              placeholder="Razão Social ou Nome do Grupo"
              class="input-field"
            />
          </div>

          <div>
            <label class="label-tech text-slate-400">Escopo do Serviço</label>
            <div class="relative">
              <select
                x-model="businessData.servico"
                class="input-field appearance-none cursor-pointer pr-10"
              >
                <option value="PGRS">Elaboração de PGRS Profissional</option>
                <option value="Licenciamento">Licenciamento Ambiental Integrado</option>
                <option value="Auditoria">Auditoria de Conformidade (Lote)</option>
                <option value="Inventario">Inventário de Carbono & ESG</option>
              </select>
              <div class="absolute right-4 top-1/2 -translate-y-1/2 pointer-events-none text-slate-400">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M19 9l-7 7-7-7" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
              </div>
            </div>
          </div>

          <div>
            <label class="label-tech text-slate-400">Especificidades Técnicas</label>
            <textarea
              x-model="businessData.detalhes"
              rows="5"
              class="input-field resize-none"
              placeholder="Descreva detalhes da operação, número de funcionários, área útil ou passivos conhecidos..."
            ></textarea>
          </div>

          <button
            @click="generateBusinessDoc('generate_proposal')"
            :disabled="loading || !businessData.cliente"
            class="w-full bg-slate-900 hover:bg-amber-600 text-white font-black py-5 rounded-2xl transition-all flex items-center justify-center gap-3 group shadow-xl shadow-slate-200 disabled:bg-slate-200 disabled:shadow-none uppercase text-[11px] tracking-widest active:scale-95"
          >
            <template x-if="loading">
              <div class="w-4 h-4 border-2 border-white/20 border-t-white rounded-full animate-spin"></div>
            </template>
            <span x-text="loading ? 'Redigindo...' : 'Gerar Proposta Comercial'"></span>
          </button>
        </div>
      </div>
    </div>

    <div class="lg:col-span-2">
      <div
        class="bg-slate-100 border border-slate-200 rounded-[2.5rem] overflow-hidden flex flex-col min-h-[820px] max-h-[90vh] shadow-inner relative"
      >
        <div
          class="bg-white/80 backdrop-blur-md px-8 py-5 border-b border-slate-200 flex justify-between items-center z-20 sticky top-0"
        >
          <div class="flex items-center gap-3">
            <div class="w-3 h-3 bg-red-400 rounded-full"></div>
            <span class="text-[10px] font-black text-slate-400 uppercase tracking-widest"
              >Rascunho_Inteligente.pdf</span
            >
          </div>
          
          <div class="flex gap-4">
            <button
              @click="generateBusinessDoc('generate_contract')"
              x-show="businessOutput && !loading"
              class="text-[10px] bg-slate-100 hover:bg-slate-200 text-slate-700 px-5 py-2.5 rounded-xl font-black uppercase tracking-tighter transition-all"
            >
              Converter p/ Contrato
            </button>
            <button
              @click="exportToPDF()"
              x-show="businessOutput && !loading"
              class="text-[10px] bg-amber-500 hover:bg-slate-900 text-white px-5 py-2.5 rounded-xl font-black uppercase tracking-tighter shadow-lg shadow-amber-100 transition-all"
            >
              Exportar PDF
            </button>
          </div>
        </div>

        <div
          class="flex-1 p-12 overflow-y-auto custom-scrollbar flex justify-center bg-slate-200/50"
        >
          <div
            id="auren-doc-canvas"
            class="w-full max-w-2xl bg-white shadow-[0_20px_50px_rgba(0,0,0,0.1)] p-16 md:p-20 text-slate-800 text-sm relative min-h-[1000px] transition-all duration-500"
          >
            <template x-if="loading">
                <div class="absolute inset-0 bg-white/80 z-20 flex flex-col items-center justify-center p-12 backdrop-blur-[2px]">
                    <div class="relative w-16 h-16 mb-6">
                      <div class="absolute inset-0 border-4 border-amber-100 rounded-full"></div>
                      <div class="absolute inset-0 border-4 border-amber-500 border-t-transparent rounded-full animate-spin"></div>
                    </div>
                    <p class="text-slate-900 font-black animate-pulse uppercase tracking-[0.2em] text-[11px]">Construindo Instrumento Jurídico...</p>
                </div>
            </template>

            <template x-if="!businessOutput && !loading">
              <div
                class="h-full flex flex-col items-center justify-center text-slate-300 py-40"
              >
                <svg class="w-16 h-16 mb-6 opacity-20" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
                <p class="font-black uppercase tracking-[0.3em] text-center text-[10px] leading-relaxed">
                  Aguardando Parâmetros para Redação<br>
                  <span class="font-medium lowercase italic opacity-60 font-serif text-sm">O motor de IA redigirá uma proposta personalizada</span>
                </p>
              </div>
            </template>

            <div
              class="prose prose-slate max-w-none font-serif text-justify selection:bg-amber-100"
              x-html="formatDoc(businessOutput)"
            ></div>

            <div x-show="businessOutput" class="mt-20 pt-10 border-t border-slate-100 flex justify-between items-end opacity-40 grayscale">
              <div class="text-[9px] font-mono leading-tight">
                DOCUMENTO GERADO VIA AUREN INTELLIGENCE<br>
                REF: <span x-text="Date.now()"></span>
              </div>
              <div class="text-[10px] font-black uppercase tracking-widest">Auren Business Platform</div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
