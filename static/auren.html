<!DOCTYPE html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <title>AUREN | Platform ERP</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script
      defer
      src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js"
    ></script>
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;900&family=JetBrains+Mono:wght@400;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  </head>
  <body x-data="aurenPlatform()" x-init="init()" class="custom-scrollbar">
    <div class="flex h-screen overflow-hidden">
      <aside
        class="w-64 bg-[#0d1117] border-r border-[#30363d] flex flex-col p-6 space-y-8 z-50"
      >
        <div>
          <h1 class="text-2xl font-black tracking-tighter text-white">
            Auren<span class="text-[#d4af37]">.</span>
          </h1>
          <p
            class="text-[9px] font-mono text-zinc-500 uppercase tracking-widest"
          >
            CONSULTORIA AMBIENTAL // v1.0
          </p>
        </div>

        <nav class="space-y-1 flex-1">
          <template x-for="item in menuItems" :key="item.id">
            <button
              @click="currentTab = item.id"
              :class="currentTab === item.id ? 'active bg-white/5 text-white border-l-2 border-[#d4af37]' : ''"
              class="sidebar-btn w-full flex items-center gap-3 px-4 py-3 text-sm font-medium text-zinc-400 hover:text-white hover:bg-white/5 transition-all duration-200 rounded-lg"
            >
              <span x-html="item.icon"></span>
              <span x-text="item.label"></span>
            </button>
          </template>
        </nav>

        <div class="pt-6 border-t border-[#30363d]">
          <div class="flex items-center gap-2">
            <div class="w-2 h-2 rounded-full bg-green-500 animate-pulse"></div>
            <span class="text-[10px] font-mono text-zinc-500 uppercase"
              >Engine Online</span
            >
          </div>
        </div>
      </aside>

      <main
        class="flex-1 overflow-y-auto bg-[#010409] p-8 md:p-12 custom-scrollbar"
      >
        <div
          x-show="sections[currentTab]"
          x-html="sections[currentTab]"
          x-transition:enter="transition ease-out duration-300"
          x-transition:enter-start="opacity-0 translate-y-4"
          x-transition:enter-end="opacity-100 translate-y-0"
        ></div>

        <div
          x-show="!sections[currentTab]"
          class="flex items-center justify-center h-full"
        >
          <div
            class="text-zinc-500 font-mono animate-pulse flex flex-col items-center gap-4"
          >
            <div
              class="w-12 h-12 border-4 border-[#d4af37]/20 border-t-[#d4af37] rounded-full animate-spin"
            ></div>
            Carregando Auren Engine...
          </div>
        </div>
      </main>
    </div>

    <script src="auren.js"></script>
  </body>
</html>
