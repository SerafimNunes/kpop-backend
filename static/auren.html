<!DOCTYPE html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>AUREN | Platform ERP</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <script defer src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;900&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body x-data="aurenPlatform()" class="custom-scrollbar bg-[#F4F7F6] font-['Inter']">
    <div class="flex h-screen overflow-hidden">
      
      <aside class="w-64 bg-white border-r border-[#E2E8F0] flex flex-col p-6 space-y-8 z-50 shadow-[4px_0_24px_rgba(0,0,0,0.02)]">
        <div>
          <h1 class="text-2xl font-black tracking-tighter text-[#2D3436]">
            Auren<span class="text-[#00B894]">.</span>
          </h1>
          <p class="text-[9px] font-mono text-[#64748B] uppercase tracking-widest">
            CONSULTORIA AMBIENTAL // v1.4
          </p>
        </div>

        <nav class="space-y-1 flex-1">
          <template x-for="item in menuItems" :key="item.id">
            <button
              @click="navigate(item.id)"
              :class="currentTab === item.id ? 'bg-[#F4F7F6] text-[#00B894] shadow-sm' : 'text-[#64748B] hover:bg-slate-50'"
              class="sidebar-btn w-full flex items-center gap-3 px-4 py-3 text-sm font-semibold rounded-xl transition-all duration-200"
            >
              <span x-html="item.icon" class="w-5 h-5"></span>
              <span x-text="item.label"></span>
            </button>
          </template>
        </nav>

        <div class="pt-6 border-t border-slate-100">
          <div class="flex items-center gap-2 px-2">
            <div :class="connected ? 'bg-[#00B894]' : 'bg-red-500'" class="w-2 h-2 rounded-full animate-pulse"></div>
            <span class="text-[10px] font-mono text-slate-400 uppercase tracking-tighter" x-text="connected ? 'Engine Online' : 'Offline'"></span>
          </div>
        </div>
      </aside>

      <div class="flex-1 flex flex-col overflow-hidden">
        
        <header class="h-16 bg-white border-b border-[#E2E8F0] flex items-center justify-between px-8 shadow-sm z-40">
          <div class="flex items-center gap-8">
            <div class="flex flex-col">
              <span class="text-[9px] uppercase font-bold tracking-widest text-slate-400">Saldo em Caixa</span>
              <span class="text-sm font-bold text-[#2D3436] font-mono" x-text="formatCurrency(globalStats.balance)">R$ 0,00</span>
            </div>
            <div class="flex flex-col border-l pl-8 border-slate-100">
              <span class="text-[9px] uppercase font-bold tracking-widest text-slate-400">Projetos Críticos</span>
              <span class="text-sm font-bold text-red-500 font-mono" x-text="globalStats.criticalProjects">0</span>
            </div>
          </div>
          <div class="flex items-center gap-4">
            <div class="bg-[#F4F7F6] px-4 py-2 rounded-lg flex items-center gap-3 border border-slate-100">
              <span class="text-[9px] uppercase font-bold text-slate-500 tracking-tighter">Radar Legislativo:</span>
              <span class="text-[10px] font-bold text-[#00B894] font-mono" x-text="globalStats.lastUpdate">Sincronizando...</span>
            </div>
          </div>
        </header>

        <main class="flex-1 overflow-y-auto p-8 md:p-12 custom-scrollbar relative">
          <div
            x-show="sections[currentTab]"
            x-html="sections[currentTab]"
            x-transition:enter="transition ease-out duration-300"
            x-transition:enter-start="opacity-0 translate-y-4"
            x-transition:enter-end="opacity-100 translate-y-0"
          ></div>

          <div x-show="!sections[currentTab]" class="flex items-center justify-center h-full">
            <div class="text-slate-400 font-mono animate-pulse flex flex-col items-center gap-4">
              <div class="w-12 h-12 border-4 border-emerald-50 border-t-[#00B894] rounded-full animate-spin"></div>
              <span class="text-xs uppercase tracking-[0.2em]">Acessando Camada de Inteligência...</span>
            </div>
          </div>
        </main>
      </div>
    </div>

    <div class="fixed bottom-6 right-6 z-[100] space-y-3 w-80">
      <template x-for="note in notifications" :key="note.id">
        <div 
          x-transition:enter="transition ease-out duration-300"
          x-transition:enter-start="opacity-0 translate-x-8"
          x-transition:enter-end="opacity-100 translate-x-0"
          x-transition:leave="transition ease-in duration-200"
          x-transition:leave-start="opacity-100"
          x-transition:leave-end="opacity-0"
          :class="{
            'bg-emerald-500 shadow-emerald-200/50': note.type === 'success',
            'bg-red-500 shadow-red-200/50': note.type === 'error',
            'bg-slate-800 shadow-slate-900/20': note.type === 'info'
          }"
          class="p-4 rounded-xl shadow-2xl text-white text-xs font-medium flex justify-between items-center border border-white/10 backdrop-blur-sm"
        >
          <div class="flex items-center gap-3">
            <div class="w-1.5 h-1.5 rounded-full bg-white/50 animate-pulse"></div>
            <span x-text="note.text"></span>
          </div>
          <button @click="notifications = notifications.filter(n => n.id !== note.id)" class="ml-4 opacity-50 hover:opacity-100 transition-opacity font-bold">✕</button>
        </div>
      </template>
    </div>

    <script src="js/auren-core.js"></script>

    <script src="js/modules/dashboard.js"></script>
    <script src="js/modules/comercial.js"></script>
    <script src="js/modules/vistoria.js"></script>
    <script src="js/modules/engenharia.js"></script>
    <script src="js/modules/financeiro.js"></script>
  </body>
</html>
