<div x-data="dashboardModule" class="space-y-8 animate-fade-in">
  <div class="flex justify-between items-end">
    <div>
      <h2 class="text-3xl font-black tracking-tight text-slate-900 uppercase">
        Command Center
      </h2>
      <p class="text-slate-500 text-sm font-mono">
        Visão Estratégica da Operação | AUREN INTELLIGENCE
      </p>
    </div>
    <div class="text-right hidden md:block">
      <span
        class="text-[10px] font-bold text-slate-400 uppercase tracking-widest"
        >Motor de IA</span
      >
      <div class="flex items-center gap-2 text-emerald-500 font-mono text-xs">
        <span class="relative flex h-2 w-2">
          <span
            class="animate-ping absolute inline-flex h-full w-full rounded-full bg-emerald-400 opacity-75"
          ></span>
          <span
            class="relative inline-flex rounded-full h-2 w-2 bg-emerald-500"
          ></span>
        </span>
        Latência: <span x-text="stats.tempoIA + 's'"></span>
      </div>
    </div>
  </div>

  <div class="grid grid-cols-12 gap-6">
    <div
      class="col-span-12 md:col-span-4 bg-white p-6 rounded-xl border border-slate-200 shadow-sm"
    >
      <div class="flex items-center justify-between mb-6">
        <div class="flex items-center gap-3">
          <div
            class="w-8 h-8 flex items-center justify-center rounded-lg bg-amber-100 text-amber-600 font-bold"
          >
            H
          </div>
          <h3 class="font-bold text-slate-800 tracking-tight text-sm uppercase">
            Leads Quentes
          </h3>
        </div>
        <span
          class="text-[10px] font-mono bg-amber-50 text-amber-600 px-2 py-1 rounded border border-amber-100"
          x-text="leads.length + ' DETECTADOS'"
        ></span>
      </div>
      <div class="space-y-3">
        <template x-for="lead in leads" :key="lead.id">
          <a
            :href="lead.url"
            target="_blank"
            class="block p-3 rounded-lg bg-slate-50 border border-slate-100 hover:border-amber-300 hover:bg-amber-50 transition-all group"
          >
            <div class="flex justify-between items-start">
              <span
                class="font-bold text-sm text-slate-700 group-hover:text-amber-900"
                x-text="lead.empresa"
              ></span>
              <span
                class="text-[10px] font-black text-amber-600 bg-white px-1.5 py-0.5 rounded border"
                x-text="lead.score"
              ></span>
            </div>
            <p
              class="text-[10px] text-slate-500 mt-1 font-mono uppercase"
              x-text="lead.tag"
            ></p>
          </a>
        </template>
      </div>
    </div>

    <div
      class="col-span-12 md:col-span-5 bg-white p-6 rounded-xl border border-slate-200 shadow-sm"
    >
      <div class="flex items-center justify-between mb-6">
        <div class="flex items-center gap-3">
          <div
            class="w-8 h-8 flex items-center justify-center rounded-lg bg-blue-100 text-blue-600 font-bold"
          >
            R
          </div>
          <h3 class="font-bold text-slate-800 tracking-tight text-sm uppercase">
            Radar Legislativo
          </h3>
        </div>
        <button
          @click="addNotification('Sincronizando com Diário Oficial...', 'info')"
          class="text-blue-500 hover:rotate-180 transition-transform duration-500"
        >
          <svg
            xmlns="http://www.w3.org/2000/svg"
            class="h-4 w-4"
            fill="none"
            viewBox="0 0 24 24"
            stroke="currentColor"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2"
              d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"
            />
          </svg>
        </button>
      </div>
      <div class="space-y-4">
        <template x-for="news in radarNews" :key="news.id">
          <a
            :href="news.url"
            target="_blank"
            class="flex gap-4 items-start p-2 rounded-lg hover:bg-blue-50 transition-colors group"
          >
            <span
              class="text-[9px] font-black text-blue-600 bg-blue-50 px-2 py-1 rounded uppercase tracking-tighter border border-blue-100 group-hover:bg-blue-600 group-hover:text-white transition-colors"
              x-text="news.tag"
            ></span>
            <div>
              <p
                class="text-sm font-semibold text-slate-700 leading-snug"
                x-text="news.title"
              ></p>
              <p
                class="text-[11px] text-slate-500 mt-1"
                x-text="news.summary"
              ></p>
            </div>
          </a>
        </template>
      </div>
    </div>

    <div
      class="col-span-12 md:col-span-3 bg-white p-6 rounded-xl border border-slate-200 shadow-sm"
    >
      <div class="flex items-center gap-3 mb-6">
        <div
          class="w-8 h-8 flex items-center justify-center rounded-lg bg-slate-900 text-white font-bold text-xs italic"
        >
          !
        </div>
        <h3 class="font-bold text-slate-800 tracking-tight text-sm uppercase">
          Semáforo de Risco
        </h3>
      </div>
      <div class="space-y-2">
        <template x-for="risco in semaforo" :key="risco.label">
          <button
            @click="navigate(risco.action)"
            class="w-full flex items-center justify-between p-3 rounded-lg border border-transparent hover:border-slate-200 hover:bg-slate-50 transition-all group"
          >
            <span
              class="font-bold text-xs text-slate-600 uppercase tracking-tighter"
              x-text="risco.label"
            ></span>
            <span class="flex items-center gap-3">
              <span
                class="text-lg font-black font-mono group-hover:scale-110 transition-transform"
                :class="risco.colorClass"
                x-text="risco.count"
              ></span>
              <div class="w-2 h-2 rounded-full" :class="risco.bgClass"></div>
            </span>
          </button>
        </template>
      </div>
    </div>

    <div
      class="col-span-12 bg-white rounded-xl border border-slate-200 shadow-sm overflow-hidden"
    >
      <div
        class="p-6 border-b border-slate-50 flex justify-between items-center"
      >
        <div>
          <h3 class="font-bold text-slate-800 tracking-tight uppercase text-sm">
            Operação em Tempo Real
          </h3>
          <p
            class="text-[10px] text-slate-400 font-mono mt-1 uppercase tracking-widest"
          >
            Status de Vistorias e Laudos Técnicos
          </p>
        </div>
      </div>
      <div class="overflow-x-auto font-sans">
        <table class="w-full text-left text-sm">
          <thead class="bg-slate-50/50 border-b border-slate-100">
            <tr
              class="text-slate-400 text-[10px] uppercase font-black tracking-widest"
            >
              <th class="px-6 py-4">Cliente / Unidade</th>
              <th class="px-6 py-4">Status Processual</th>
              <th class="px-6 py-4 text-center">Progresso</th>
              <th class="px-6 py-4">Líder Técnico</th>
              <th class="px-6 py-4 text-right">Ação</th>
            </tr>
          </thead>
          <tbody class="divide-y divide-slate-50">
            <template x-for="projeto in projetos" :key="projeto.id">
              <tr class="hover:bg-slate-50/80 transition-colors">
                <td class="px-6 py-4">
                  <div
                    class="font-bold text-slate-800"
                    x-text="projeto.cliente"
                  ></div>
                  <div
                    class="text-[10px] text-slate-400 font-mono"
                    x-text="projeto.id"
                  ></div>
                </td>
                <td class="px-6 py-4">
                  <span
                    :class="projeto.statusClass"
                    class="px-2 py-1 text-[9px] font-black rounded-md border uppercase tracking-tighter"
                    x-text="projeto.status"
                  ></span>
                </td>
                <td class="px-6 py-4">
                  <div class="flex items-center gap-3">
                    <div
                      class="flex-1 bg-slate-100 rounded-full h-1.5 overflow-hidden"
                    >
                      <div
                        :class="projeto.barClass"
                        class="h-full rounded-full transition-all duration-1000"
                        :style="'width: ' + projeto.progresso + '%'"
                      ></div>
                    </div>
                    <span
                      class="text-[10px] font-mono font-bold text-slate-500"
                      x-text="projeto.progresso + '%'"
                    ></span>
                  </div>
                </td>
                <td
                  class="px-6 py-4 text-xs font-semibold text-slate-600"
                  x-text="projeto.responsavel"
                ></td>
                <td class="px-6 py-4 text-right">
                  <button
                    @click="addNotification('Abrindo dossiê ' + projeto.id, 'info')"
                    class="px-3 py-1.5 bg-slate-900 text-white text-[10px] font-bold rounded hover:bg-[#00B894] transition-colors"
                  >
                    ANLISAR
                  </button>
                </td>
              </tr>
            </template>
          </tbody>
        </table>
      </div>
    </div>
  </div>
</div>
